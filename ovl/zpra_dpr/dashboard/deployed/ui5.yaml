# yaml-language-server: $schema=https://sap.github.io/ui5-tooling/schema/ui5.yaml.json

specVersion: "4.0"
metadata:
  name: zdprdashboard
type: application
server:
  customMiddleware:
    - name: fiori-tools-proxy
      afterMiddleware: compression
      configuration:
        ignoreCertErrors: false # If set to true, certificate errors will be ignored. E.g. self-signed certificates will be accepted
        ui5:
          path:
            - /resources
            - /test-resources
          url: https://ui5.sap.com
        backend:
          - path: /sap
            url: http://ovlocq.sap.ongcvidesh.in:443
            destination: OCQ
          - path: /sap/opu/odata/sap/ZDPR_Q_BOEPD_TREND_CDS/
            url: http://ovlocq.sap.ongcvidesh.in:443
            client: '500'
            destination: OCQ
          - path: /sap/opu/odata/sap/ZDPR_Q_TARGET_QUERY_CDS/
            url: http://ovlocq.sap.ongcvidesh.in:443
            client: '500'
            destination: OCQ
          - path: /sap/opu/odata/sap/ZDPR_Q_DAILY_TREND_CDS/
            url: http://ovlocq.sap.ongcvidesh.in:443
            client: '500'
            destination: OCQ
          - path: /sap/opu/odata/sap/ZDPR_Q_PROD_QUERY_CDS/
            url: http://ovlocq.sap.ongcvidesh.in:443
            client: '500'
            destination: OCQ
    - name: fiori-tools-appreload
      afterMiddleware: compression
      configuration:
        port: 35729
        path: webapp
        delay: 300
    - name: fiori-tools-preview
      afterMiddleware: fiori-tools-appreload
      configuration:
        flp:
          theme: sap_horizon
          # Changes by Arnav on 23/09/26 - local sandbox knows the detail apps'
          # intents so card navigation can be tested before deployment.
          # local = absolute path of the detail app's project root in the dev
          # space. Add one entry per detail app once that project exists.
          apps:
            - target: /apps/zdprrecords
              local: /home/user/projects/zdprrecords
              intent:
                object: DPRRecords
                action: display
builder:
  resources:
    excludes:
      - /test/**
      - /localService/**
